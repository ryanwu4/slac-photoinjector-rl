# SHAC over the conditional-flow surrogate (FlowBunchEnv). Network/config blocks
# are IDENTICAL to shac_photoinjector.yaml so the flow-MBRL run is directly
# comparable to the v1 scalar-MLP SHAC run. Only diff_env differs: the reward is
# a property computed from the flow's sampled output bunch.
params:
  diff_env:
    name: FlowBunchEnv
    episode_length: 64
    stochastic_env: true
    action_scale: 0.05
    distgen_drift_std: 0.0
    property: norm_emit_4d      # registry key; first test = 4D emittance
    reward_mode: minimize       # minimize | maximize | target
    n_particles: 512            # MC particles per env-step (variance vs speed)
    # ---- moving-target (aspect,tilt) controller (used only with --moving-shape) ----
    shape_scale: 0.3            # reward scale: y_norm = ||(s1,s2)-(s1*,s2*)||/scale
    action_rate_penalty: 0.0    # -lambda*||Δaction|| smooth-control penalty (0=off)
    curriculum:                 # CurriculumConfig: setpoint-trajectory generator + ramp
      enabled: true             # ramp difficulty static->step->smooth over training
      r_max: 0.85               # reachable shape-vector disk radius for setpoints
      p_static_base: 0.75       # P(static) at difficulty 0 (decreases with difficulty)
      p_static_slope: 0.70
      p_static_floor: 0.05
      p_steps: 0.30             # P(piecewise-constant steps)
      hold_frac_easy: 0.50      # step hold length / T at difficulty 0 -> 1
      hold_frac_hard: 0.125
      hold_min: 4
      smooth_r_lo: 0.30         # tilt-rotation radius lower bound
      tilt_turns_easy: 0.25     # tilt rotation turns over an episode (easy -> hard)
      tilt_turns_hard: 2.0
      ou_sigma_easy: 0.02       # OU random-walk per-step noise (easy -> hard)
      ou_sigma_hard: 0.10
      ou_decay: 0.92
      ou_init_frac: 0.70
      difficulty_bias_lo: 0.40  # per-episode difficulty ~ progress*U(bias_lo,1)
  general:
    seed: 0
    device: cuda:0
    render: false
    train: true
    logdir: logs/shac_flow
  config:
    name: PhotoinjectorFlowSHAC
    num_actors: 32
    steps_num: 16
    max_epochs: 500
    actor_learning_rate: 5e-4
    critic_learning_rate: 1e-3
    lr_schedule: linear
    gamma: 0.99
    critic_method: td-lambda
    lambda: 0.95
    target_critic_alpha: 0.95 #CHANGED -- stabilizes training perhaps
    obs_rms: true
    ret_rms: false
    critic_iterations: 16
    num_batch: 4
    truncate_grads: true
    grad_norm: 1.0
    rew_scale: 1.0
    save_interval: 50
    betas: [0.7, 0.95]
    player:
      games_num: 64
      deterministic: false
  network:
    actor_mlp:
      units: [128, 128]
      activation: elu
    actor_logstd_init: -1.0
    critic: CriticMLP
    critic_mlp:
      units: [128, 128]
      activation: elu
