[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoinjector-rl"
version = "0.1.0"
description = "FACET-II photoinjector pipeline: LHS sweep -> surrogate (scalar MLP + conditional flow) -> RL (PPO/SHAC/BPTT, incl. first-order MBRL over flow-computed bunch properties)"
requires-python = ">=3.11"
dependencies = [
    "lume-impact",
    "distgen",
    "xopt>=2.7",
    "h5py",
    "pmd-beamphysics",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
mpi = ["mpi4py>=4.1"]
# Surrogate (scalar MLP + conditional affine-coupling flow) + RL stack.
# The affine flow needs no extra deps beyond torch.
emittance-target = [
    "torch>=2.0",
    "lightning>=2.0",
    "matplotlib>=3.7",
    "gymnasium>=1.0",
    "pytest>=8",
    "stable-baselines3>=2.3",
    "tensorboard>=2.15",
    "wandb>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
